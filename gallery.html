<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="x" id="lbx" aria-label="Close">&times;</button>
  <button class="nav prev" id="lbprev" aria-label="Previous photo">&#8249;</button>
  <img id="lbimg" src="" alt="">
  <button class="nav next" id="lbnext" aria-label="Next photo">&#8250;</button>
</div>

<script>
document.getElementById('yr').textContent=new Date().getFullYear();
(function(){
  var imgs=[].slice.call(document.querySelectorAll('#galgrid img'));
  var lb=document.getElementById('lb'),lbimg=document.getElementById('lbimg'),i=0;
  function open(n){i=(n+imgs.length)%imgs.length;lbimg.src=imgs[i].src;lbimg.alt=imgs[i].alt;lb.classList.add('on');}
  function close(){lb.classList.remove('on');}
  imgs.forEach(function(im,n){im.parentNode.addEventListener('click',function(){open(n);});});
  document.getElementById('lbx').onclick=close;
  document.getElementById('lbprev').onclick=function(e){e.stopPropagation();open(i-1);};
  document.getElementById('lbnext').onclick=function(e){e.stopPropagation();open(i+1);};
  lb.addEventListener('click',function(e){if(e.target===lb)close();});
  document.addEventListener('keydown',function(e){if(!lb.classList.contains('on'))return;if(e.key==='Escape')close();else if(e.key==='ArrowLeft')open(i-1);else if(e.key==='ArrowRight')open(i+1);});
})();
</script>
